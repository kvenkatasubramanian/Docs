<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1500" height="470" fill="#ffffff"/>
  <text x="750" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">rec-recover.sh — recovery flow</text>

  <!-- regions -->
  <rect x="20" y="60" width="550" height="340" rx="12" fill="#f0faf4" stroke="#30a46c" stroke-width="1.5"/>
  <text x="295" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d" letter-spacing="1">READ-ONLY  ·  safe to run any time</text>

  <rect x="640" y="60" width="620" height="340" rx="12" fill="#fff6ec" stroke="#ff8c1a" stroke-width="1.5"/>
  <text x="950" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#b85c00" letter-spacing="1">CHANGES THE CLUSTER  ·  requires --execute --token</text>

  <rect x="1290" y="60" width="190" height="340" rx="12" fill="#f5f6f8" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1385" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563" letter-spacing="1">MANUAL</text>

  <!-- connectors (y = 185) -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="185" x2="218" y2="185"/>
    <line x1="370" y1="185" x2="398" y2="185"/>
    <line x1="550" y1="185" x2="566" y2="185"/>
    <line x1="634" y1="185" x2="658" y2="185"/>
    <line x1="810" y1="185" x2="828" y2="185"/>
    <line x1="980" y1="185" x2="986" y2="185"/>
    <line x1="1054" y1="185" x2="1078" y2="185"/>
    <line x1="1230" y1="185" x2="1298" y2="185"/>
  </g>

  <!-- read-only nodes -->
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#30a46c" stroke-width="2"/>
    <text x="115" y="180" font-weight="700" fill="#111827">precheck</text>
    <text x="115" y="200" font-size="12" fill="#4b5563">verdict + token</text>

    <rect x="220" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#30a46c" stroke-width="2"/>
    <text x="295" y="180" font-weight="700" fill="#111827">diagnostics</text>
    <text x="295" y="200" font-size="12" fill="#4b5563">log collector</text>

    <rect x="400" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#30a46c" stroke-width="2"/>
    <text x="475" y="180" font-weight="700" fill="#111827">backup</text>
    <text x="475" y="200" font-size="12" fill="#4b5563">CCS + DB files</text>
  </g>

  <!-- gate 1: approval token -->
  <g transform="translate(600 185)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#fff8d6" stroke="#d4a017" stroke-width="2"/>
    <text x="0" y="-44" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6500">approval</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6500">token</text>
  </g>

  <!-- mutating nodes -->
  <g font-size="14" text-anchor="middle">
    <rect x="660" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#ff8c1a" stroke-width="2"/>
    <text x="735" y="180" font-weight="700" fill="#111827">recover-cluster</text>
    <text x="735" y="200" font-size="12" fill="#4b5563">patch REC, wait</text>

    <rect x="830" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#30a46c" stroke-width="2"/>
    <text x="905" y="180" font-weight="700" fill="#111827">plan-db</text>
    <text x="905" y="200" font-size="12" fill="#4b5563">classify (read-only)</text>
  </g>

  <!-- gate 2: Active-Active decision -->
  <g transform="translate(1020 185)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#fff8d6" stroke="#d4a017" stroke-width="2"/>
    <text x="0" y="-44" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6500">Active-Active</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6500">decision</text>
  </g>

  <g font-size="14" text-anchor="middle">
    <rect x="1080" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#ff8c1a" stroke-width="2"/>
    <text x="1155" y="180" font-weight="700" fill="#111827">recover-db</text>
    <text x="1155" y="200" font-size="12" fill="#4b5563">one rladmin per DB</text>

    <rect x="1300" y="150" width="170" height="70" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1385" y="180" font-weight="700" fill="#111827">validate</text>
    <text x="1385" y="200" font-size="12" fill="#4b5563">by you</text>
  </g>

  <!-- notes under nodes -->
  <g font-size="11.5" fill="#374151">
    <text x="115" y="262" text-anchor="middle">REC, persistence, PVCs,</text>
    <text x="115" y="278" text-anchor="middle">nodes, operator, pods,</text>
    <text x="115" y="294" text-anchor="middle">rladmin, modules, REAADB</text>
    <text x="115" y="318" text-anchor="middle" font-weight="700" fill="#1f7a4d">RECOVERY_NOT_NEEDED</text>
    <text x="115" y="334" text-anchor="middle" font-weight="700" fill="#b85c00">RECOVERY_RECOMMENDED</text>
    <text x="115" y="350" text-anchor="middle" font-weight="700" fill="#c0392b">BLOCKED</text>

    <text x="295" y="262" text-anchor="middle">log_collector.py -m all</text>
    <text x="295" y="278" text-anchor="middle">best effort, never blocks</text>
    <text x="295" y="294" text-anchor="middle">(needs Python ≥ 3.11)</text>

    <text x="475" y="262" text-anchor="middle">ccs/ccs-redis.rdb</text>
    <text x="475" y="278" text-anchor="middle">persist/redis per pod</text>
    <text x="475" y="294" text-anchor="middle">SHA256SUMS manifest</text>
    <text x="475" y="318" text-anchor="middle" font-weight="700" fill="#b85c00">copy off the cluster</text>

    <text x="735" y="262" text-anchor="middle">clusterRecovery: true</text>
    <text x="735" y="278" text-anchor="middle">wait Running + flag cleared</text>
    <text x="735" y="294" text-anchor="middle">pods Ready, nodes OK,</text>
    <text x="735" y="310" text-anchor="middle">no running actions</text>

    <text x="905" y="262" text-anchor="middle">rladmin recover list</text>
    <text x="905" y="278" text-anchor="middle">standard vs CRDB</text>
    <text x="905" y="294" text-anchor="middle">ready vs missing-files</text>
    <text x="905" y="318" text-anchor="middle" font-weight="700" fill="#c0392b">UNDECIDED / BLOCKED stop here</text>

    <text x="1155" y="262" text-anchor="middle">1. data-bearing CRDBs</text>
    <text x="1155" y="278" text-anchor="middle">2. standard databases</text>
    <text x="1155" y="294" text-anchor="middle">3. config-only CRDBs</text>
    <text x="1155" y="318" text-anchor="middle" font-weight="700" fill="#b85c00">never 'recover all'</text>

    <text x="1385" y="262" text-anchor="middle">rladmin status: active</text>
    <text x="1385" y="278" text-anchor="middle">app connectivity</text>
    <text x="1385" y="294" text-anchor="middle">TLS / auth</text>
    <text x="1385" y="310" text-anchor="middle">CRDB peer sync</text>
  </g>

  <!-- gate notes -->
  <g font-size="11.5" fill="#6b7280" text-anchor="middle">
    <text x="600" y="262">from precheck</text>
    <text x="600" y="278">valid 4 h</text>
    <text x="1020" y="262">--aa-config-only</text>
    <text x="1020" y="278">--aa-data-bearing</text>
  </g>

  <!-- footer -->
  <text x="750" y="438" text-anchor="middle" font-size="12.5" fill="#4b5563">
    <tspan font-weight="700">all</tspan> runs precheck → diagnostics → backup and stops at the approval token; with --execute --token it continues through recover-db.
  </text>
  <text x="750" y="458" text-anchor="middle" font-size="12.5" fill="#4b5563">Every run writes artifacts/&lt;run-id&gt;/report.md. Nothing is deleted, no pod is force-deleted, the REC is never recreated.</text>
</svg>
